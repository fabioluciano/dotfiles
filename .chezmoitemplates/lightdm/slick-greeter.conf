[Greeter]
background=/usr/local/share/backgrounds/dotfiles/lightdm-background
background-color=#202020
draw-user-backgrounds=false
draw-grid=false
theme-name=Colloid-Grey-Dark-Compact
icon-theme-name=Colloid-Dark
font-name=Sans 10
content-align=center
only-on-monitor=auto
logo=/usr/local/share/backgrounds/dotfiles/arch-menu.svg
show-hostname=false
show-power=true
show-a11y=true
show-keyboard=true
show-clock=true
show-quit=true
clock-format=%a %d %b  %H:%M
enable-hidpi=auto
stretch-background-across-monitors=false
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
