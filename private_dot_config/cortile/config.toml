################################################################################
#                                                                              #
#           https://github.com/leukipp/cortile/blob/main/config.toml           #
#                                                                              #
# NOTA: o Compiz usa o modelo de viewports (wall 2×2, _NET_NUMBER_OF_DESKTOPS
# = 1), não desktops EWMH múltiplos. Cortile faz tiling por viewport visível.
# Para mover janelas entre viewports, use o plugin "put" do Compiz
# (Shift+Super+1–4) — isso é independente do Cortile e não sofre interferência.
#
################################################################################

#################################### Tiling ####################################

# Tiling ativo por padrão; estado persistido em cache.
tiling_enabled = true

# Layout inicial; persistido em cache após primeira mudança.
tiling_layout = "vertical-left"

# Layouts disponíveis no ciclo next/previous.
tiling_cycle = [
    "vertical-left",
    "vertical-right",
    "horizontal-top",
    "horizontal-bottom",
    "maximized",
    "fullscreen",
]

# Duração do overlay de notificação de layout [ms] (0 = desativado).
tiling_gui = 1000

# Entradas do menu no systray.
tiling_icon = [
    ["toggle",   "Enabled"],
    ["decoration", "Decoration"],
    ["", ""],
    ["layout_vertical_left",    "Vertical Left"],
    ["layout_vertical_right",   "Vertical Right"],
    ["layout_horizontal_top",   "Horizontal Top"],
    ["layout_horizontal_bottom","Horizontal Bottom"],
    ["layout_maximized",        "Maximized"],
    ["layout_fullscreen",       "Fullscreen"],
    ["", ""],
    ["master_increase", "Add Master"],
    ["master_decrease", "Remove Master"],
    ["", ""],
    ["slave_increase", "Add Slave"],
    ["slave_decrease", "Remove Slave"],
    ["", ""],
    ["reset",   "Reset"],
    ["restore", "Restore"],
    ["", ""],
    ["exit", "Exit"],
]

#################################### Window ####################################

# Janelas ignoradas pelo tiling (RE2; WM_CLASS, WM_NAME).
# Use `xprop WM_CLASS` para encontrar a classe de uma janela.
window_ignore = [
    # Sistema / Auth / Rede
    ["nm-.*",            ""],
    ["gcr-.*",           ""],
    ["polkit-.*",        ""],
    ["wrapper-.*",       ""],
    ["lightdm-.*",       ""],
    ["blueman-.*",       ""],
    ["gnome-keyring.*",  ""],

    # XFCE
    ["xfce4-panel.*",           ""],
    ["xfce4-notifyd.*",         ""],
    ["xfce4-appfinder.*",       ""],
    ["xfce4-settings.*",        ""],
    ["xfce4-power-manager.*",   ""],
    ["xfdesktop.*",             ""],
    ["Wrapper-2.0",             ""],
    ["Xfce4-terminal",          "Preferences"],

    # Áudio
    ["pavucontrol.*", ""],
    ["pulseaudio.*",  ""],

    # Thunar / File roller
    ["thunar",       "File Operation Progress"],
    ["thunar",       "Confirm to replace files"],
    ["file-roller.*",""],
    ["engrampa.*",   ""],

    # Utilitários flutuantes
    ["galculator.*",        ""],
    ["gnome-calculator.*",  ""],
    ["xfce4-screenshooter.*",""],
    ["flameshot.*",         ""],
    ["gpick.*",             ""],
    ["gcolor.*",            ""],
    ["zenity.*",            ""],
    ["yad.*",               ""],
    ["arandr.*",            ""],
    ["lxappearance.*",      ""],
    ["nitrogen.*",          ""],
    ["feh.*",               ""],
    ["eog.*",               ""],
    ["ristretto.*",         ""],
    ["viewnior.*",          ""],

    # Senha / Auth
    ["keepassxc.*", ".*Unlock.*"],
    ["bitwarden.*", ""],
    ["1password.*", ""],

    # Mídia / Jogos
    ["vicinae.*", ""],
    ["vlc.*",     ""],
    ["mpv.*",     ""],
    ["steam.*",   ""],
    ["lutris.*",  ""],
]

# Máximo de janelas master (0–5).
window_masters_max = 1

# Máximo de janelas slave (1–5).
window_slaves_max = 4

# Espaço entre janelas em pixels (0–100).
window_gap_size = 8

# Foco ao hover após delay [ms] (0 = desativado).
# Mantido desativado: Compiz tem foco-no-click configurado.
window_focus_delay = 0

# Decorações de janela ativas por padrão; persistido em cache.
window_decoration = true

################################## Proportion ##################################

# Passo de incremento/decremento da proporção master-slave (0.0–1.0).
proportion_step = 0.05

# Proporção mínima de uma janela em relação ao workspace (0.0–1.0).
proportion_min = 0.2

##################################### Edge #####################################

# Margem da área de tiling nos monitores secundários [top, right, bottom, left].
# Cortile detecta o painel XFCE automaticamente via _NET_WM_STRUT_PARTIAL.
edge_margin = [4, 4, 4, 4]

# Margem da área de tiling no monitor primário.
edge_margin_primary = [4, 4, 4, 4]

# Tamanho da área de hot-corner nos cantos (0 = desativado).
# Desativado: Compiz gerencia os cantos (Expo top-left/right, Scale bottom-left).
edge_corner_size = 0

# Tamanho da área de hot-corner nos centros das bordas (0 = desativado).
edge_center_size = 0

################################################################################
[colors] # Valores RGBA para elementos de UI.
################################################################################

gui_text            = [192, 202, 245, 255]  # TokyoNight foreground
gui_background      = [26,  27,  38,  230]  # TokyoNight bg + alpha
gui_client_slave    = [36,  40,  59,  255]  # TokyoNight bg-highlight
gui_client_master   = [122, 162, 247, 255]  # TokyoNight blue accent
icon_background     = [0,   0,   0,   0]
icon_foreground     = [192, 202, 245, 255]

################################################################################
[keys] # Control-Shift como prefixo evita conflitos com o Compiz (Mod4-*).
# Use `xev` para encontrar nomes de teclas.
################################################################################

# === Controle de tiling ===
enable      = "Control-Shift-Home"
disable     = "Control-Shift-End"
toggle      = "Control-Shift-t"
decoration  = "Control-Shift-d"
restore     = "Control-Shift-r"
reset       = "Control-Shift-BackSpace"

# === Ciclo de layouts ===
cycle_next     = "Control-Shift-Next"
cycle_previous = "Control-Shift-Prior"

# === Seleção de layout ===
layout_vertical_left    = "Control-Shift-Left"
layout_vertical_right   = "Control-Shift-Right"
layout_horizontal_top   = "Control-Shift-Up"
layout_horizontal_bottom= "Control-Shift-Down"
layout_maximized        = "Control-Shift-space"
layout_fullscreen       = "Control-Shift-Return"

# === Gerenciamento de master/slave ===
slave_increase      = "Control-Shift-plus"
slave_decrease      = "Control-Shift-minus"
master_increase     = "Control-Shift-KP_Add"
master_decrease     = "Control-Shift-KP_Subtract"
master_make         = "Control-Shift-KP_5"
master_make_next    = "Control-Shift-KP_6"
master_make_previous= "Control-Shift-KP_4"

# === Navegação entre janelas ===
window_next     = "Control-Shift-KP_2"
window_previous = "Control-Shift-KP_8"

# === Multi-monitor ===
screen_next     = "Control-Shift-KP_9"
screen_previous = "Control-Shift-KP_7"

# === Proporção ===
proportion_increase = "Control-Shift-KP_3"
proportion_decrease = "Control-Shift-KP_1"

# === Modificadores ===
# Alt pressionado junto: afeta todos os monitores.
mod_screens = "Mod1"
# Super pressionado junto: afeta todos os workspaces.
# Com Compiz wall (1 desktop EWMH), tem efeito limitado.
mod_workspaces = "Mod4"

################################################################################
[corners] # Desativado: Compiz gerencia hot-corners (Expo, Scale, ShowDesktop).
################################################################################

top_left      = ""
top_center    = ""
top_right     = ""
center_right  = ""
bottom_right  = ""
bottom_center = ""
bottom_left   = ""
center_left   = ""

################################################################################
[systray]
################################################################################

click_left   = "toggle"
click_middle = "reset"
click_right  = ""
scroll_up    = "cycle_previous"
scroll_down  = "cycle_next"
scroll_left  = "proportion_decrease"
scroll_right = "proportion_increase"
