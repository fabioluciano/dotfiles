# ============================================================
# Picom (v12+) — XFCE / X11 (Otimizado para NVIDIA)
# Sombras suaves, blur discreto e animações rápidas
# ============================================================

# Renderização e Sincronização NVIDIA
backend = "glx";
vsync = true;
use-damage = true; # Mude para false se notar artefatos no blur com NVIDIA
xrender-sync-fence = true; # Crítico para evitar flickering/atraso na NVIDIA
frame-pacing = true; # Mude para false se sentir micro-stuttering nas animações

# Detecção de Janelas
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
detect-rounded-corners = true;

# Evita piscadas do monitor ao entrar/sair de tela cheia na NVIDIA
unredir-if-possible = false;

# Sombras
shadow = false;
shadow-radius = 20;
shadow-opacity = 0.65;
shadow-offset-x = -20;
shadow-offset-y = -16;
shadow-color = "#000000";

# Cantos e Opacidade de Borda
corner-radius = 0; # >0 pinta de preto a moldura de 2px do xfwm4
frame-opacity = 1.0;

# Fade
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.08;
fade-delta = 8;

# Blur (Sintaxe estruturada moderna)
blur: {
    method = "dual_kawase";
    strength = 4;
    background = true;
    background-frame = false;
    background-fixed = true;
};

# ============================================================
# Regras Específicas (Avaliadas em ordem; as últimas prevalecem)
# ============================================================
rules = (
    # 1. Animações somente nas janelas de aplicativos e diálogos
    {
        match = "window_type = 'normal' || window_type = 'dialog'";
        animations = (
            {
                triggers = [ "open", "show" ];
                preset = "appear";
                duration = 0.18;
                scale = 0.97;
            },
            {
                triggers = [ "close", "hide" ];
                preset = "disappear";
                duration = 0.14;
                scale = 0.97;
            },
            {
                triggers = [ "geometry" ];
                preset = "geometry-change";
                duration = 0.18;
            }
        );
    },

    # 2. Painel e desktop do XFCE. clip-shadow-above só no painel: no desktop
    #    (Xfdesktop cobre a tela inteira) ele impediria qualquer sombra de
    #    janelas sobre o papel de parede.
    {
        match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Xfce4-panel' || class_g = 'Xfdesktop'";
        shadow = false;
        corner-radius = 0;
        blur-background = false;
        fade = false;
    },
    {
        match = "window_type = 'dock' || class_g = 'Xfce4-panel'";
        clip-shadow-above = true;
    },

    # 3. Menus: acabamento discreto e resposta rápida
    {
        match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'combo'";
        corner-radius = 8;
        shadow = false;
        opacity = 0.98;
        blur-background = false;
    },

    # 4. Dicas de ferramentas (Tooltips) e Drag-and-Drop
    {
        match = "window_type = 'tooltip' || window_type = 'dnd'";
        corner-radius = 6;
        shadow = false;
        opacity = 0.96;
        blur-background = false;
        fade = false;
    },

    # 5. Evita sombra duplicada e blur quebrado em apps GTK / CSD / Firefox / Zoom
    {
        match = "_GTK_FRAME_EXTENTS@ || window_type = 'utility' || (class_g = 'firefox' && argb) || class_g = 'zoom'";
        shadow = false;
        corner-radius = 0;
        blur-background = false;
    },

    # 6. Ferramentas de captura de tela, seleção de área e bloqueio de tela
    {
        match = "class_g = 'Xfce4-screenshooter' || class_g = 'Flameshot' || class_g = 'slop' || class_g = 'Peek' || class_g = ' Xfce4-screensaver'";
        shadow = false;
        corner-radius = 0;
        blur-background = false;
        fade = false;
        animations = ();
    },

    # 7. Notificações do XFCE e Alt-Tab do XFWM4
    {
        match = "window_type = 'notification' || class_g = 'Xfce4-notifyd' || class_g = 'xfwm4'";
        shadow = false;
        corner-radius = 0;
        blur-background = false;
    },

    # 8. Tela cheia (remove cantos arredondados nas bordas do monitor)
    {
        match = "fullscreen";
        shadow = false;
        corner-radius = 0;
    },

    # 9. Vídeos e aplicativos em tela cheia estrita
    {
        match = "fullscreen";
        blur-background = false;
        opacity = 1.0;
    }
);
