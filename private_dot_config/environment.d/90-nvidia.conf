# VA-API via NVDEC para processos lançados por serviços systemd --user
# (ex.: apps abertos pelo Vicinae). A sessão Xfce recebe os mesmos valores
# via ~/.xprofile; mantenha os dois arquivos em sincronia.
LIBVA_DRIVER_NAME=nvidia

# Firefox/NVIDIA: o sandbox do RDD bloqueia o caminho VA-API neste sistema.
# A variável só afeta o Firefox; o sandbox de conteúdo continua ativo.
MOZ_DISABLE_RDD_SANDBOX=1

# NVIDIA sincroniza uma única saída; fixar em DP-2 mantém o VSync no monitor de 165 Hz.
__GL_SYNC_TO_VBLANK=1
__GL_SYNC_DISPLAY_DEVICE=DP-2
