# Clean PATH for makepkg to prevent user environment managers (mise, asdf, etc.)
# from shadowing system toolchains and Python during package builds.
export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin"

# mise exports these from the interactive shell. With the clean PATH above they
# would pair /usr/bin/go with mise's toolchain, failing every Go build with
# 'compile: version "go1.x" does not match go tool version "go1.x-X:nodwarf5"'.
unset GOROOT GOBIN
