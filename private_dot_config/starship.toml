# Starship Configuration
# https://starship.rs/config/

palette = "tokyo_night"

# Global settings
format = """
$os\
$username\
$hostname\
$directory\
$direnv\
$git_branch\
$git_status\
$git_metrics\
$git_state\
$git_commit\
${custom.jj}\
$terraform\
$kubernetes\
$docker_context\
$aws\
$python\
$nodejs\
$rust\
$golang\
$java\
$helm\
$package\
$cmd_duration\
$shell\
$shlvl\
$status
$character"""

right_format = "$time"

add_newline = true
command_timeout = 500
scan_timeout = 30

# Tokyo Night palette
[palettes.tokyo_night]
color_fg = "#c0caf5"
color_bg = "#1a1b26"
blue     = "#7aa2f7"
cyan     = "#7dcfff"
green    = "#9ece6a"
purple   = "#bb9af7"
red      = "#f7768e"
yellow   = "#e0af68"
orange   = "#ff9e64"
white    = "#c0caf5"

# OS symbol
[os]
disabled = false
format = "[$symbol](bold white) "

[os.symbols]
Macos  = "󰀵"
Arch   = "󰣇"
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
Linux  = "󰌽"

# Username
[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = true

# Hostname
[hostname]
ssh_only = false
format = "on [$hostname](bold dimmed white) "
trim_at = "."
disabled = false

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
format = "at [$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " 󰌾"
read_only_style = "red"
home_symbol = "~"

# Direnv
[direnv]
format = "[$symbol$loaded/$allowed]($style) "
symbol = "direnv "
style = "bold orange"
allowed_msg = "✓"
denied_msg = "✗"
not_allowed_msg = "?"
disabled = false

# Character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[←](bold green)"

# Git Branch
[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold yellow"
truncation_length = 20
truncation_symbol = "…"

# Git Status
[git_status]
format = "([\\[ $all_status$ahead_behind\\]]($style) )"
style = "bold red"
conflicted = "⚔️  "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "󰇎 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Git Metrics
[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled = false

# Git State
[git_state]
format = "[\\($state( $progress_current of $progress_total)\\)]($style) "
style = "bright-black"

# Git Commit
[git_commit]
commit_hash_length = 7
format = "[\\($hash$tag\\)]($style) "
style = "bold green"
only_detached = true
tag_disabled = false
tag_symbol = "󰠁 "

# Command Duration (right side)
[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"
show_milliseconds = false

# Time (right side)
[time]
disabled = false
format = "[$time]($style)"
style = "bold dimmed white"
time_format = "%H:%M"

# Exit status code
[status]
format = "[$symbol$status]($style) "
symbol = "✖ "
style = "bold red"
disabled = false

# Shell indicator
[shell]
zsh_indicator = ""
bash_indicator = "bash "
fish_indicator = "fish "
style = "bold cyan"
disabled = false

# Nível de aninhamento de shell
[shlvl]
disabled = false
threshold = 2
symbol = "↕ "
style = "bold yellow"

# AWS
[aws]
format = "on [$symbol($profile )(\\($region\\) )]($style)"
style = "bold yellow"
symbol = "☁ "
disabled = false

[aws.region_aliases]
us-east-1 = "use1"
us-east-2 = "use2"
us-west-1 = "usw1"
us-west-2 = "usw2"

# Kubernetes
[kubernetes]
format = "on [$symbol$context( \\($namespace\\))]($style) "
style = "bold blue"
symbol = "󱃾 "
disabled = false

[kubernetes.context_aliases]
'arn:.*?cluster/(?P<cluster_name>[\w-]+)' = 'aws-$cluster_name'

# Docker
[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
style = "bold blue"
disabled = false
only_with_files = true

# Languages
[python]
format = "via [$symbol($version )(\\($virtualenv\\) )]($style)"
symbol = " "
style = "bold yellow"
pyenv_version_name = false
python_binary = ["python", "python3"]

[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold green"

[rust]
format = "via [$symbol($version )]($style)"
symbol = "󱘗 "
style = "bold red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"

[java]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

# DevOps Tools
[terraform]
format = "via [$symbol$workspace]($style) "
symbol = " "
style = "bold purple"
disabled = false

[helm]
format = "via [$symbol($version )]($style)"
symbol = "⎈ "
style = "bold white"

[package]
format = "via [$symbol$version]($style) "
symbol = "󰏗 "
style = "bold 208"
disabled = true

[custom.jj]
command = "jj log --ignore-working-copy -r @ --no-graph -T 'change_id.short(8)'"
when = "jj root --quiet --ignore-working-copy 2>/dev/null"
format = "on [$output]($style) "
style = "bold purple"
disabled = false
