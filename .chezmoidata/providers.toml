[pi.providers.kimicode]
tiers = { orchestrator = ["k3"], implementation = ["kimi-for-coding"], planner = ["kimi-for-coding"], quick = ["kimi-for-coding"], standard = ["kimi-for-coding"], complex = ["k3"], deep = ["k3"] }

[pi.providers.zai]
tiers = { orchestrator = ["glm-5.2"], implementation = ["glm-5.2"], planner = ["glm-4.7-flash"], quick = ["glm-4.7-flash"], standard = ["glm-4.7"], complex = ["glm-5.2"], deep = ["glm-5.2"] }

[pi.providers.alibaba-token-plan]
tiers = { orchestrator = ["qwen3.8-max-preview"], implementation = ["qwen3.7-max"], planner = ["qwen3.7-plus"], quick = ["qwen3.6-flash"], standard = ["qwen3.7-plus"], complex = ["qwen3.8-max-preview"], deep = ["qwen3.8-max-preview"] }

# OpenAI — 38 modelos no catálogo nativo do pi (gpt-5.x com thinking).
