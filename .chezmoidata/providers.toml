# OMP — matrizes por KEY (providers, profiles, profile_aliases)
# Cada entry referencia o id nativo do omp via o registry [providers.X]
# (campo `omp_id`); o template omp-state.tmpl faz o lookup. Keys preservam
# compatibilidade com o state file ~/.config/omp/.active_provider.
# `cycling_order` = provider-ids do omp para `modelProviderOrder` (Ctrl+P),
# csv, ativo primeiro.

[omp]
default_provider = "xiaomi"

[omp.providers.xiaomi]
tiers = { orchestrator = ["mimo-v2.5"], implementation = ["mimo-v2.5"], planner = ["mimo-v2.5"], quick = ["mimo-v2.5"], standard = ["mimo-v2.5"], complex = ["mimo-v2.5"], deep = ["mimo-v2.5"] }
cycling_order = "xiaomi-token-plan-sgp"

[omp.providers.opencode]
tiers = { orchestrator = ["gpt-5.5"], implementation = ["gpt-5.5"], planner = ["claude-haiku-4-5"], quick = ["claude-haiku-4-5"], standard = ["claude-sonnet-4-6"], complex = ["gpt-5.5"], deep = ["gpt-5.5"] }
cycling_order = "opencode-zen"

[omp.providers.minimax]
tiers = { orchestrator = ["MiniMax-M3"], implementation = ["MiniMax-M3"], planner = ["MiniMax-M2.7"], quick = ["MiniMax-M2.5"], standard = ["MiniMax-M2.7"], complex = ["MiniMax-M3"], deep = ["MiniMax-M3"] }
cycling_order = "minimax"

[omp.providers.deepseek]
tiers = { orchestrator = ["deepseek-v4-pro"], implementation = ["deepseek-v4-pro"], planner = ["deepseek-v4-flash"], quick = ["deepseek-v4-flash"], standard = ["deepseek-v4-flash"], complex = ["deepseek-v4-pro"], deep = ["deepseek-v4-pro"] }
cycling_order = "deepseek"

# Kimi: o provider nativo `kimi-code` do omp é OAuth-gated (0 modelos sem
# login); os modelos Kimi estão autenticados em `opencode-go` (registry).
[omp.providers.kimicode]
tiers = { orchestrator = ["kimi-k3"], implementation = ["kimi-k2.7-code"], planner = ["kimi-k2.5"], quick = ["kimi-k2.5"], standard = ["kimi-k2.7-code"], complex = ["kimi-k3"], deep = ["kimi-k3"] }
cycling_order = "opencode-go"

[omp.providers.zai]
tiers = { orchestrator = ["glm-5.2"], implementation = ["glm-5.2"], planner = ["glm-5.1"], quick = ["glm-5.1"], standard = ["glm-5.2"], complex = ["glm-5.2"], deep = ["glm-5.2"] }
cycling_order = "zai"

[omp.providers.alibaba-token-plan]
tiers = { orchestrator = ["qwen3.7-max"], implementation = ["qwen3.7-max"], planner = ["qwen3.7-plus"], quick = ["qwen3.6-flash"], standard = ["qwen3.7-plus"], complex = ["qwen3.7-max"], deep = ["qwen3.7-max"] }
cycling_order = "alibaba-token-plan"

# OpenAI — 105 modelos no catálogo nativo do omp. Tiers alinhados com
# `[opencode.models.openai]` (gpt-5.6-{terra,sol,luna} como topo).
[omp.providers.openai]
tiers = { orchestrator = ["gpt-5.6-terra", "gpt-5.6-sol"], implementation = ["gpt-5.6-sol", "gpt-5.6-terra"], planner = ["gpt-5.6-luna", "gpt-5.4-mini"], quick = ["gpt-5.4-mini", "gpt-5-mini"], standard = ["gpt-5.6-luna"], complex = ["gpt-5.6-terra", "gpt-5.5-pro"], deep = ["gpt-5.6-terra", "gpt-5.5-pro"] }
cycling_order = "openai"

# OpenCode Token Plan — kimi-k2.6/k2.7/k3, deepseek-v4, glm-5.x, grok-4.5, hy3,
# gpt-5.6-luna, mimo-v2.5, minimax-m2.7/m3, qwen3.x. Distinto de [providers.opencode]
# (free tier "opencode-zen"). Catálogo nativo: 25 modelos.
[omp.providers.opencode-go]
tiers = { orchestrator = ["kimi-k3", "gpt-5.6-luna"], implementation = ["kimi-k2.7-code", "deepseek-v4-pro"], planner = ["deepseek-v4-flash", "glm-5.2"], quick = ["glm-5.1", "grok-4.5"], standard = ["deepseek-v4-flash"], complex = ["kimi-k3"], deep = ["deepseek-v4-pro", "hy3"] }
cycling_order = "opencode-go"

# GitLab Duo — OAuth-gated. Sem login no GitLab, 0 modelos disponíveis.
# Catálogo nativo: 16 modelos "duo-chat-*" (claude/gpt-5 variantes).
[omp.providers.gitlab-duo]
tiers = { orchestrator = ["duo-chat-opus-4-6"], implementation = ["duo-chat-sonnet-4-6", "duo-chat-gpt-5-2-codex"], planner = ["duo-chat-gpt-5-2"], quick = ["duo-chat-haiku-4-5", "duo-chat-gpt-5-mini"], standard = ["duo-chat-sonnet-4-5"], complex = ["duo-chat-opus-4-6"], deep = ["duo-chat-opus-4-6"] }
cycling_order = "gitlab-duo"

