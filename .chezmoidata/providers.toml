# providers.toml — Única matriz de providers do dotfiles, consumida pelo
# `change-providers` para os agentes opencode, omp e pi.
#
# Como ler:
#   [providers.<key>]   registry compartilhado: display_name + o id NATIVO do
#                       provider em cada binário (opencode_id / omp_id / pi_id).
#                       Ids são diferentes por binário (ex: xiaomi ↔
#                       xiaomi-token-plan-sgp ↔ xiaomi-mimo, zai ↔ zai-coding)
#                       e podem sumir ou mudar de nome entre versões.
#   [opencode.*]        matrizes por KEY do opencode (ids inline "provider/model"):
#                       models, variants, profiles de agentes, overrides,
#                       historian_models. Consumidas por opencode-state.tmpl,
#                       opencode_base.jsonc, oh-my-openagent/oh-my-opencode-
#                       slim templates, change-providers (subcomando opencode).
#   [omp.*]             matrizes por KEY do omp (ids resolvidos via registry
#                       omp_id): providers, profiles, profile_aliases.
#                       Consumidas por omp-state.tmpl, config.yml.tmpl,
#                       change-providers (subcomando omp).
#   [pi.*]              matrizes por KEY do pi (ids resolvidos via registry
#                       pi_id): providers (tiers), profiles, profile_aliases.
#                       Consumidas por pi-state.tmpl, settings.json.tmpl,
#                       change-providers (subcomando pi).
#
# Regras de edição:
#   - As KEYS ([providers.X], [opencode.models.X], [omp.providers.X]) são
#     referenciadas pelos state files (~/.config/{opencode,omp}/.active_provider)
#     e pelos templates de completão. Não renomear sem migrar os state files.
#   - As matrizes por KEY NÃO podem ser derivadas (ids por agente diferem;
#     variantes por tier também), então continuam separadas por seção.
#   - Drift check: os ids de modelo de cada entry DEVEM existir no catálogo
#     real do binário alvo (`opencode models`, `omp models`). Este arquivo é
#     dado estático; quando o binário muda de catálogo, atualizar aqui.

# Registry — id nativo do provider em cada binário.
# `opencode_id` = namespace usado nas strings "provider/model" do opencode.
# `pi_id`       = provider-id nativo do catálogo `pi` (models.json em ~/.pi/agent).
[providers.zai]
display_name = "ZAI (Zhipu GLM)"
opencode_id = "zai"
pi_id = "zai-coding"

[providers.minimax]
display_name = "MiniMax"
opencode_id = "minimax"
# omp_id = "minimax" (catálogo omp tem só "minimax", 8 modelos).
# pi_id = "minimax" (não "minimax-coding" — este está quebrado no pi:
# modelos sem thinking, max=16.4K, endpoint retorna 404).
omp_id = "minimax"
pi_id = "minimax"

[providers.deepseek]
display_name = "DeepSeek"
opencode_id = "deepseek"
pi_id = "deepseek"

[providers.xiaomi]
display_name = "Xiaomi MiMo (Singapore Token Plan)"
opencode_id = "xiaomi"
# omp_id = "xiaomi-token-plan-sgp": catálogo omp nativo (4 modelos).
# pi_id = "xiaomi-mimo": free tier do pi (2 modelos); o pi também lista
# "xiaomi-token-plan-sgp" (3 modelos) como provider separado.
omp_id = "xiaomi-token-plan-sgp"
pi_id = "xiaomi-mimo"

[providers.gitlab-duo]
display_name = "GitLab Duo (OAuth-gated)"
# omp-only; requer login no GitLab. Sem auth, 0 modelos disponíveis no catálogo
# nativo. Catálogo omp tem 16 modelos "duo-chat-*" e 1 "gitlab-duo-agent".
# Não existe no pi nem no opencode.
omp_id = "gitlab-duo"

[providers.openai]
display_name = "OpenAI"
opencode_id = "openai"
omp_id = "openai"
pi_id = "openai"

[providers.opencode]
display_name = "OpenCode (Zen / Go catalogs)"
opencode_id = "opencode"
# omp_id = "opencode-zen": catálogo omp nativo é "opencode-zen" (61 modelos).
# Sem esse mapeamento, defaultModel fica "opencode/..." (inexistente).
omp_id = "opencode-zen"
pi_id = "opencode"

[providers.opencode-go]
display_name = "OpenCode Go (Token Plan — Kimi/DeepSeek/GLM)"
# Provider Token Plan: kimi-k2.6/k2.7/k3, deepseek-v4, glm-5.2, gpt-5.6-luna, etc.
# Distinto de [providers.opencode] (free tier). Não há namespace "opencode-go" nas
# matrizes do opencode; entry de registry é omp/pi-only.
omp_id = "opencode-go"
pi_id = "opencode-go"

[providers.kimicode]
display_name = "Kimi (Moonshot)"
opencode_id = "kimicode"
# Provider nativo `kimi-code` do omp é OAuth-gated e pode ter zero modelos
# sem login; usar `opencode-go`, que serve os modelos Kimi autenticado
# (Token Plan). Sem omp_id = "opencode-go", defaultModel fica
# "kimicode/kimi-for-coding" (inexistente no catálogo nativo).
omp_id = "opencode-go"
# kimi-code no pi é OAuth-gated (0 modelos sem login) — mas ao contrário do
# omp, o pi-catálogo ainda o lista; mantemos pi_id = "kimi-code".
pi_id = "kimi-code"

[providers.alibaba-token-plan]
display_name = "Alibaba Token Plan (Qwen, Singapore)"
opencode_id = "alibaba-token-plan"
omp_id = "alibaba-token-plan"
pi_id = "alibaba-token-plan"

[providers.mix]
display_name = "Mix (minimax + xiaomi + deepseek)"
# Combinação de matrizes do opencode; não há provider correspondente no omp.

[providers.zen-free]
display_name = "OpenCode Zen Free"
opencode_id = "opencode"
# Modelos "-free" não existem no catálogo do omp; entry de registry é
# opencode-only.

