# providers.toml — Matriz de providers do dotfiles consumida pelo change-providers
# Alinhada 100% com o catálogo oficial da API do Navy (https://api.navy/v1/models):
#   - Modelos premium: false (gratuitos/multiplicador base): Codestral, DeepSeek V4 Pro/Flash/R1/V3, Mistral Large, Hermes 405B, Sonar Pro, Grok Code, Gemini Flash, etc.
#   - Modelos premium: true (pagos/multiplicador alto): Claude Sonnet 5, Claude Opus 5, Claude Haiku 4.5, GPT-5.6 Sol/Terra, Gemini 3.7 Flash, etc.

# ==============================================================================
# Registry — id nativo do provider em cada binário.
# ==============================================================================
[providers.navy]
display_name = "Navy (NavyAI)"
opencode_id = "navy"
omp_id = "navy"
pi_id = "navy"
codewhale_id = "navy"
codewhale_kind = "openai-compatible"
codewhale_base_url = "https://api.navy/v1"
codewhale_api_key_env = "NAVYAI_API_KEY"
models = [
  "claude-sonnet-5",
  "claude-opus-5",
  "claude-haiku-4.5",
  "gpt-5.6-sol",
  "gpt-5.6-terra",
  "deepseek-v4-pro",
  "deepseek-v4-flash",
  "deepseek-chat",
  "deepseek-reasoner",
  "codestral-latest",
  "mistral-large-latest",
  "hermes-4-405b",
  "grok-code-fast-1",
  "glm-5-venice",
  "qwen3.8-27b",
  "minimax-m3",
  "kimi-k2.7-code",
  "gemini-2.0-flash",
  "gemini-2.5-flash",
  "gemini-3.7-flash",
  "gpt-4o-mini",
  "o3-mini",
  "sonar-pro",
  "sonar-deep-research"
]

[providers.xiaomi]
display_name = "Xiaomi MiMo (Singapore Token Plan)"
opencode_id = "xiaomi-token-plan-sgp"
omp_id = "xiaomi-token-plan-sgp"
pi_id = "xiaomi-mimo"
codewhale_id = "xiaomi-mimo"
codewhale_api_key_env = "MIMO_API_KEY"

[providers.google]
display_name = "Google (Gemini / Antigravity)"
opencode_id = "google"
omp_id = "google-antigravity"
pi_id = "antigravity"
codewhale_id = "google"

# ==============================================================================
# OPENCODE — Matrizes de Modelos por Tier
# ==============================================================================
