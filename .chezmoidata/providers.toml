# PI — matrizes por KEY (providers, profiles, profile_aliases)
# pi (earendil-works/pi, upstream do omp) é mais simples: settings.json só tem
# defaultProvider + defaultModel + defaultThinkingLevel (sem modelRoles/fallback).
# O catálogo vive em models.json (auto-gerenciado por `pi update`), NÃO template.
# Ids nativos resolvidos via registry [providers.X].pi_id.
# Tiers: mesmo vocabulário do omp (orchestrator, implementation, planner, quick,
# standard, complex, deep) — pi-state.tmpl picka o modelo do tier do profile.

[pi]
default_provider = "xiaomi"

[pi.providers.xiaomi]
tiers = { orchestrator = ["mimo-v2.5-pro"], implementation = ["mimo-v2.5-pro"], planner = ["mimo-v2.5"], quick = ["mimo-v2.5"], standard = ["mimo-v2.5"], complex = ["mimo-v2.5-pro"], deep = ["mimo-v2.5-pro"] }

[pi.providers.opencode]
tiers = { orchestrator = ["gpt-5.5"], implementation = ["gpt-5.5"], planner = ["gpt-5.4-mini"], quick = ["gpt-5.4-mini"], standard = ["claude-sonnet-4-6"], complex = ["gpt-5.5"], deep = ["gpt-5.5"] }

[pi.providers.minimax]
