# Alibaba Token Plan (OpenAI-compatible endpoint, built-in provider em opencode)
# 4 modelos Qwen no plano atual: qwen3.8-max-preview (mais recente), qwen3.7-max
# (mais capaz estável), qwen3.7-plus (balanceado), qwen3.6-flash (rápido).
# Nao ha VL dedicado — todos usam text-only no Token Plan.
[opencode.models.alibaba-token-plan]
orchestrator = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max", "alibaba-token-plan/qwen3.7-plus"]
implementation = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max", "alibaba-token-plan/qwen3.7-plus"]
