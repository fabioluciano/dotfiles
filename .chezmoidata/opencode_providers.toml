search = ["alibaba-token-plan/qwen3.6-flash"]
vision = ["opencode/gemini-3.1-pro", "opencode/mimo-v2.5-free"]
review = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max"]
long_running = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max", "alibaba-token-plan/qwen3.7-plus"]
quick = ["alibaba-token-plan/qwen3.6-flash"]
standard = ["alibaba-token-plan/qwen3.7-plus"]
complex = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max"]
visual = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max"]
deep = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max"]
ultrabrain = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max"]
ultrawork = ["alibaba-token-plan/qwen3.8-max-preview", "alibaba-token-plan/qwen3.7-max"]

# Mix — combina modelos de minimax (API Anthropic), xiaomi/mimo e deepseek
# (ambos OpenAI-compatible). Exclui openai, opencode/zen-free, kimicode, zai e
# alibaba-token-plan. Ordem em cada chain = prioridade de fallback.
[opencode.models.mix]
orchestrator = ["minimax/MiniMax-M3", "xiaomi/mimo-v2.5-pro", "deepseek/deepseek-v4-pro"]
implementation = ["minimax/MiniMax-M3", "xiaomi/mimo-v2.5-pro", "deepseek/deepseek-v4-pro"]
