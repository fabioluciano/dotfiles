standard = ["minimax/MiniMax-M2.7", "xiaomi/mimo-v2.5", "deepseek/deepseek-v4-flash"]
complex = ["minimax/MiniMax-M3", "xiaomi/mimo-v2.5-pro", "deepseek/deepseek-v4-pro"]
